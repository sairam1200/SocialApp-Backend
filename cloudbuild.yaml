# Google Cloud Build pipeline — Gaddr Search & Me, Backend
#
# GitHub Actions is deliberately not used: at this repository's usage it is the
# more expensive option, and the deployment target is already GCP (Cloud Run), so
# Cloud Build bills to the same project and needs no cross-cloud credentials.
#
# Trigger (create once, then it runs on every push):
#
#   gcloud builds triggers create github \
#     --name=gaddr-backend-main \
#     --repo-name=Gaddr-Search-Me-Backend \
#     --repo-owner=TeamGaddr \
#     --branch-pattern='^main$' \
#     --build-config=cloudbuild.yaml
#
# Gating order is deliberate: the cheap, fast checks run first and fail the build
# before the expensive Docker build starts. Steps with the same waitFor run in
# parallel.

substitutions:
  _SERVICE_NAME: gaddr-backend
  _REGION: europe-north1        # Finland — closest region to Swedish users
  _ARTIFACT_REPO: gaddr

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

# 20 minutes: the install and Docker build dominate. Raise this rather than
# letting a slow build fail spuriously.
timeout: 1200s

steps:
  # --- 1. Install -----------------------------------------------------------
  # `npm ci` not `npm install`: it installs exactly what package-lock.json
  # specifies and fails if the lockfile is out of sync, which is what makes CI
  # reproducible.
  - id: install
    name: node:22
    entrypoint: npm
    args: ['ci', '--no-audit', '--no-fund']

  # --- 2. Static checks (parallel) ------------------------------------------
  # Types are the cheapest real signal: they catch whole classes of error in
  # seconds, so they gate everything after.
  - id: typecheck
    name: node:22
    entrypoint: npx
    args: ['tsc', '-p', 'tsconfig.json', '--noEmit']
    waitFor: ['install']

  # Errors fail the build; the 284 pre-existing warnings do not. Gating on zero
  # warnings today would make the pipeline permanently red, and a permanently red
  # pipeline gets ignored. scripts/ci.sh enforces a ratcheting warning budget
  # locally — see LINT_WARNING_BUDGET there.
  - id: lint
    name: node:22
    entrypoint: npx
    args: ['eslint', 'src', '--ext', '.ts']
    waitFor: ['install']

  # --- 3. Tests -------------------------------------------------------------
  # --ci makes snapshots fail rather than be written silently.
  # --runInBand avoids workers competing for the build machine's CPU.
  - id: test
    name: node:22
    entrypoint: npx
    args: ['jest', '--ci', '--runInBand', '--passWithNoTests=false']
    env:
      - 'NODE_ENV=test'
    waitFor: ['install']

  # --- 4. Secret scan -------------------------------------------------------
  # Mirrors the local pre-commit hook. A hook can be bypassed with --no-verify,
  # so the same check must exist server-side. A production database dump
  # containing password hashes and TOTP secrets was previously committed to this
  # repository (see docs/audit/), which is exactly what this prevents recurring.
  # --no-git scans the working tree rather than history. Two historical commits
  # contain verified false positives (long TypeScript identifiers tripping the
  # default twitter-api-key rule), so a history scan can never go green without
  # rewriting history. .gitleaks.toml allowlists those and adds rules for the
  # actual risks: committed database dumps and platform OAuth tokens.
  - id: secret-scan
    name: zricethezav/gitleaks:latest
    entrypoint: gitleaks
    args:
      - detect
      - '--source=.'
      - '--no-git'
      - '--config=.gitleaks.toml'
      - '--redact'
      - '--verbose'
      - '--no-banner'
    waitFor: ['install']

  # --- 5. Build -------------------------------------------------------------
  # Only reached if types, lint, tests and the secret scan all passed.
  - id: compile
    name: node:22
    entrypoint: npm
    args: ['run', 'build']
    waitFor: ['typecheck', 'lint', 'test', 'secret-scan']

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
      # Reuse the previous image's layers so unchanged dependencies are not rebuilt.
      - '--cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
      - '.'
    waitFor: ['compile']

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}'
    waitFor: ['docker-build']

  # --- 6. Deploy ------------------------------------------------------------
  # Pinned to the immutable $SHORT_SHA tag, never :latest, so a rollback is
  # `gcloud run services update-traffic --to-revisions=<revision>=100` and the
  # deployed artifact is always identifiable.
  #
  # Secrets come from Secret Manager, never from substitutions — build
  # substitutions are visible in build logs.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8080'
      # Matches the documented constraints in AGENTS.md. Keep the two in sync.
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--set-env-vars=NODE_ENV=production'
      - '--revision-suffix=$SHORT_SHA'
    waitFor: ['docker-push']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
