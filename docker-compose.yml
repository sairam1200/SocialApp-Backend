version: '3'

services:
  # Redis Service
  redis:
    image: redis:latest
    container_name: redis-cache
    ports:
      - "6349:6379"            
    volumes:
      - redis_data:/data     
    environment:
      - REDIS_PASSWORD=dockerredis  
    command: ["redis-server", "--bind", "0.0.0.0", "--requirepass", "dockerredis"]

  # PostgreSQL Service
  postgres:
    image: postgres:latest
    container_name: pg-database
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=dockerpg
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"            
    volumes:
      - postgres_data:/var/lib/postgresql/data  

# Volumes for persistent data
volumes:
  redis_data:
  postgres_data: